name: haoshu
services:
  backend:
    build: ./backend
    ports: ["11300:11300"]
    volumes:
      - haoshu_data:/data
      - ./fixtures:/fixtures:ro
    environment:
      数据目录: /data
      夹具目录: /fixtures
  frontend:
    build: ./frontend
    ports: ["6300:80"]
    depends_on: [backend]
volumes:
  haoshu_data:
